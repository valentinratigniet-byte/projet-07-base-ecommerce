name: CI

on:
  push:
  pull_request:

jobs:
  integrity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer PostgreSQL (docker compose)
        run: docker compose up -d

      - name: Attendre que la base soit prête
        run: |
          for i in $(seq 1 20); do
            docker exec p07_ecommerce_db pg_isready -U portfolio -d ecommerce && exit 0
            sleep 2
          done
          echo "Postgres jamais devenu ready" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Peupler la base (Faker)
        run: |
          pip install -r seed/requirements.txt
          python seed/seed.py

      - name: Tests d'intégrité (5 insertions illégales doivent être rejetées)
        run: docker exec -i p07_ecommerce_db psql -U portfolio -d ecommerce -v ON_ERROR_STOP=1 < sql/05_integrity_tests.sql
